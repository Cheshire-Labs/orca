# Alembic config for orca-core's SQLite persistence layer.

[alembic]
script_location = %(here)s/src/orca/runtime/db/alembic
prepend_sys_path = %(here)s/src
path_separator = os

# Default URL for offline generation; the env reads ORCA_DB_URL when set so
# `alembic upgrade head` can target any SQLite file.
sqlalchemy.url = sqlite+aiosqlite:///orca.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
